
name: Build InfiniteHeart

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build mod
        shell: bash
        run: |
          PROJECT_FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Cannot find build.gradle in the repository."
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteHeart-26.3
          path: '**/build/libs/*.jar'
          if-no-files-found: error
